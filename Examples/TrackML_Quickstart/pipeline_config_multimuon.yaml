common_configs:
  experiment_name: multimuongun_pt8_nonoise
  artifact_directory: /data/dust/user/bauckhag/code/TrackML/data/multiMuonGun/artifacts
  plot_output_directory: /data/dust/user/bauckhag/code/TrackML/data/multiMuonGun/eval_plots
  gpus: 1
  clear_directories: True

metric_learning_configs:
  # Dataset parameters
  input_dir: /data/dust/user/bauckhag/code/TrackML/data/multiMuonGun/output_featurestore_pt8_nonoise/
  output_dir: /data/dust/user/bauckhag/code/TrackML/data/multiMuonGun/metric_learning_processed_pt8_nonoise/
  pt_signal_cut: 8.
  pt_background_cut: 8.
  train_split: [1, 0, 0] # Number of [training, validation, testing] examples
  true_edges: modulewise_true_edges #layerwise_true_edges #
  timing: True # Use timing information in the metric learning

  # Model parameters
  spatial_channels: 4 # 3+1 for timing
  cell_channels: 0 #9
  emb_hidden: 1024
  nb_layer: 4
  emb_dim: 4 #3+1 for timing #3 #12
  activation: Tanh
  weight: 2
  randomisation: 2
  points_per_batch: 100000
  r_train: 0.05 #0.1
  r_val: 0.05 #0.1
  r_test: 0.05 #0.1
  knn: 50
  warmup: 8
  margin: 0.1
  lr: 0.001
  factor: 0.7
  patience: 4
  regime: [rp, hnm, norm]
  max_epochs: 10

gnn_configs:
  # Dataset parameters
  input_dir: /data/dust/user/bauckhag/code/TrackML/data/multiMuonGun/metric_learning_processed_pt8_nonoise/
  output_dir: /data/dust/user/bauckhag/code/TrackML/data/multiMuonGun/gnn_processed_pt8_nonoise/
  edge_cut: 0.5
  pt_signal_min: 8.
  pt_background_min: 8.
  datatype_names: [train, val, test] # Which directory prefixes to use, assuming at least a train dataset 
  datatype_split: [80, 10, 10] # Number of [training, validation, testing] examples
  noise: False #False

  # Model parameters
  spatial_channels: 4 # 3+1 for timing
  cell_channels: 0
  hidden: 128
  n_graph_iters: 6
  nb_node_layer: 3
  nb_edge_layer: 3
  layernorm: True
  aggregation: sum_max
  hidden_activation: SiLU
  weight: 2
  warmup: 10
  lr: 0.002
  factor: 0.7
  patience: 8
  truth_key: pid_signal
  regime: [pid]
  mask_background: True
  max_epochs: 10

track_building_configs:
  score_cut: 0.9
  output_dir: /data/dust/user/bauckhag/code/TrackML/data/multiMuonGun/track_building_processed_pt8_nonoise/

evaluation_configs:
  output_dir: /data/dust/user/bauckhag/code/TrackML/data/multiMuonGun/evaluation_pt8_nonoise/
  min_pt: 8
  max_eta: 4
  min_track_length: 3
  min_particle_length: 3
  matching_fraction: 0.5
  matching_style: ATLAS
